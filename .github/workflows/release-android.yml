
name: Android Release

on:
  push:
    tags:
      - 'v*'   # запуск при пуше тега, например v0.1.0+1

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ✅ Проверка формата тега: vX.Y.Z+N
      - name: Validate tag format
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "❌ Invalid tag format: $TAG"
            echo "✅ Expected format: vX.Y.Z+N (example: v0.1.0+1)"
            exit 1
          fi

      # ✅ Извлечение версий из тега
      - name: Extract versions
        id: versions
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          FULL=${TAG#v}
          CLEAN=${FULL%%+*}
          echo "full=$FULL" >> $GITHUB_OUTPUT
          echo "clean=$CLEAN" >> $GITHUB_OUTPUT

      # ✅ Обновление pubspec.yaml
      - name: Update pubspec.yaml version
        run: |
          sed -i "s/^version:.*/version: ${{ steps.versions.outputs.full }}/" pubspec.yaml
          grep version pubspec.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      # ✅ Сборка APK
      - name: Build release APK
        run: flutter build apk --release

      # ✅ Сборка AAB
      - name: Build release AAB
        run: flutter build appbundle --release

      - name: List build files
        run: ls -R build/app/outputs

      # ✅ Публикация релиза (красивый заголовок = 0.1.0)
      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          name: "${{ steps.versions.outputs.clean }}"
          tag_name: "${{ github.ref_name }}"
          prerelease: false
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
